builders:
  formidable:
    import: "package:formidable_generator/formidable_generator.dart"
    builder_factories: ["formidableBuilder"]
    build_extensions: { ".dart": [".formidable.dart"] }
    auto_apply: dependents
    build_to: source
  formidable_scope:
    import: "package:formidable_generator/formidable_generator.dart"
    builder_factories: ["formidableScopeBuilder"]
    build_extensions: { ".dart": [".formidable_scope.dart"] }
    auto_apply: dependents
    build_to: source
